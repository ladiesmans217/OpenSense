<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>OpenSense — opportunity radar</title>
<style>
  :root{--bg:#0a0e16;--panel:#101724;--panel2:#0c1220;--line:#1c2739;--line2:#243350;
        --ink:#dce6f5;--dim:#8394ad;--faint:#5a6a83;
        --acc:#5c9cff;--good:#34d399;--warn:#f5a623;--bad:#f87171;
        --mono:ui-monospace,'Cascadia Mono',Consolas,monospace}
  *{box-sizing:border-box;margin:0}
  html{scrollbar-color:#223048 var(--bg)}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,'Segoe UI',Roboto,sans-serif;padding:22px 26px 40px}
  ::selection{background:rgba(92,156,255,.28)}

  /* header — Personalize lives top-right, with a live dot when a profile exists */
  .top{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  h1 span{color:var(--acc)}
  .sub{color:var(--dim);font-size:12.5px;margin-top:2px;max-width:640px}
  #pbtn{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;background:var(--panel);
        border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:8px 15px;
        font-size:13px;font-weight:550;cursor:pointer;transition:border-color .15s,background .15s}
  #pbtn:hover{border-color:var(--acc);background:#131c2e}
  #pbtn::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--faint);transition:background .15s}
  #pbtn.on::before{background:var(--good)}
  #pbtn.on{border-color:rgba(52,211,153,.45)}

  /* stat strip — one instrument bar, hairline dividers, mono numbers */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);
         border-radius:12px;background:var(--panel);overflow:hidden;margin-bottom:12px}
  .stat{padding:12px 16px 11px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:none;background:linear-gradient(180deg,rgba(92,156,255,.07),transparent)}
  .stat b{display:block;font:600 21px/1.15 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .stat span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.9px;margin-top:4px}

  /* trend strip — the cross-source signal, one quiet line + sparkline */
  .trend{display:none;align-items:center;gap:18px;border:1px solid var(--line);border-left:2px solid var(--good);
         border-radius:12px;background:var(--panel);padding:10px 16px;margin-bottom:12px}
  .trend.on{display:flex}
  #trendText{font-size:13px;flex:1;min-width:0}
  #trendSpark{width:210px;flex:none}
  #trendSpark svg{display:block}

  /* filters + search */
  .bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;margin-bottom:6px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:99px;
        padding:5px 13px;font-size:12.5px;cursor:pointer;-webkit-tap-highlight-color:transparent;
        transition:color .15s,border-color .15s,background .15s}
  .chip:hover{color:var(--ink)}
  .chip.on{color:var(--acc);border-color:rgba(92,156,255,.55);background:rgba(92,156,255,.08)}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #q{flex:1;min-width:170px;max-width:430px;background:var(--panel2);border:1px solid var(--line);
     border-radius:9px;color:var(--ink);padding:7px 13px;font-size:13px;outline:none;transition:border-color .15s}
  #q:focus{border-color:var(--acc)}
  #sort{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--dim);
        padding:7px 11px;font-size:12.5px;outline:none;cursor:pointer}
  #count{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* columns */
  .cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}

  /* listings table */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;overflow:hidden}
  th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.9px;font-weight:600;
     background:var(--panel2)}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:rgba(92,156,255,.045)}
  @media(max-width:960px){.hide-sm{display:none}}
  a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;border:1px solid var(--line2);font-weight:500}
  .pill.kind{color:var(--acc);border-color:rgba(92,156,255,.4)}
  .pill.soon{color:var(--warn);border-color:rgba(245,166,35,.45)}
  .pill.today{color:var(--bad);border-color:rgba(248,113,113,.5)}
  .pill.new{color:var(--good);border-color:rgba(52,211,153,.45)}
  .pill.path{color:var(--good);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
  .match{color:var(--good);font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .star{cursor:pointer;user-select:none;font-size:15px;color:var(--faint);-webkit-tap-highlight-color:transparent;transition:color .15s,transform .1s}
  .star:hover{transform:scale(1.2)}
  .star.on{color:var(--warn)}

  /* event log */
  .feed{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:72vh;overflow:auto}
  .feed h2{position:sticky;top:0;background:var(--panel2);color:var(--faint);font-size:10px;
           text-transform:uppercase;letter-spacing:.9px;padding:9px 16px;border-bottom:1px solid var(--line)}
  .ev{display:flex;gap:10px;padding:6px 16px;font-size:12px}
  .ev+.ev{border-top:1px solid rgba(28,39,57,.5)}
  .ev .t{color:var(--faint);min-width:58px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;padding-top:1px}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none;background:var(--acc)}
  .ev.fail .dot{background:var(--bad)} .ev.heal .dot,.ev.enrich .dot{background:var(--good)}
  .ev small{color:var(--faint);display:block}
  .feed::-webkit-scrollbar{width:8px}
  .feed::-webkit-scrollbar-thumb{background:#223048;border-radius:4px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.7);backdrop-filter:blur(3px);
            display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;
         max-height:85vh;overflow:auto;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .modal h3{margin-bottom:2px;font-size:16px}
  .modal .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:14px 0;font-size:13px}
  .modal .kv b{color:var(--faint);font-weight:500}
  .modal .mono{font-family:var(--mono);font-size:12px;color:var(--good);word-break:break-all}
  .modal h4{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.9px;margin:14px 0 6px}
  .close{float:right;cursor:pointer;color:var(--faint);font-size:19px;background:none;border:none;line-height:1}
  .close:hover{color:var(--ink)}

  /* personalize panel */
  .pgrid{display:grid;gap:14px;margin-top:14px}
  .pgrid label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.9px;display:block;margin-bottom:7px;font-weight:600}
  .tagrow{display:flex;gap:6px;flex-wrap:wrap}
  .tag{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:99px;
       padding:4px 12px;font-size:12.5px;cursor:pointer;transition:color .15s,border-color .15s}
  .tag.on{color:var(--acc);border-color:rgba(92,156,255,.55)}
  input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
        color:var(--ink);padding:8px 11px;font-size:13.5px;outline:none}
  input[type=text]:focus{border-color:var(--acc)}
  .btn{border:1px solid var(--acc);background:var(--acc);color:#08101f;border-radius:9px;padding:8px 16px;
       font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;transition:filter .15s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:none;color:var(--acc);font-weight:500}
  .note{font-size:12px;color:var(--dim);margin-top:8px}

  /* banners */
  #banner{position:fixed;left:0;right:0;bottom:0;background:#3a1f2b;color:#ffd7d7;border-top:1px solid var(--bad);
          padding:8px 16px;font-size:13px;display:none;z-index:50;gap:10px;align-items:center}
  #banner button{margin-left:auto;background:none;border:1px solid var(--bad);color:#ffd7d7;
          border-radius:6px;padding:3px 10px;cursor:pointer}
  #toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);background:var(--panel);
         border:1px solid var(--warn);color:var(--warn);border-radius:9px;padding:8px 14px;font-size:13px;
         display:none;z-index:51}

  :focus-visible{outline:2px solid rgba(92,156,255,.6);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:960px){
    body{padding:14px 14px 32px}
    .cols{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(3,1fr)}
    .stat:nth-child(3n+1){border-left:none}
    .stat:nth-child(n+4){border-top:1px solid var(--line)}
    .trend{flex-wrap:wrap}
    #trendSpark{width:100%}
  }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>📡 Open<span>Sense</span></h1>
    <p class="sub">self-healing radar for the long tail of student opportunities · every row traceable to its collector run · <span id="runage">—</span></p>
  </div>
  <button id="pbtn" onclick="openPersonalize()">Personalize</button>
</header>

<div class="stats" id="cards"></div>
<div class="trend" id="trend"><span id="trendText"></span><span id="trendSpark"></span></div>

<div class="bar">
  <div class="chips" id="chips"></div>
  <div class="controls">
    <input id="q" type="text" placeholder="🔍 search title, org, location, skill…" autocomplete="off">
    <select id="sort">
      <option value="relevance">sort: relevance</option>
      <option value="deadline">sort: deadline</option>
      <option value="newest">sort: newest</option>
    </select>
    <span id="count"></span>
  </div>
</div>

<div class="cols">
  <div>
    <table>
      <thead><tr><th></th><th>listing</th><th class="hide-sm">kind</th><th>deadline</th><th>match</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="feed">
    <h2>event log — append-only</h2>
    <div id="events"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<div id="banner"><span id="bannerText"></span><button onclick="location.reload()">Retry</button></div>
<div id="toast"></div>

<script>
'use strict';
const $=q=>document.querySelector(q);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>new Date(ts*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const daysLeft=d=>d?Math.round((new Date(d)-Date.now())/864e5):null;
const API=location.protocol.startsWith('http');
const KINDS=['job','internship','hackathon','bounty','scholarship','event'];
const PROFILE_KEY='opensense.profile.v1';

let LISTINGS=[], STARS=new Set(), FILTER='all', PROFILE=null, QUERY='', SORT='relevance';
const storage=(()=>{  // localStorage can be unavailable (private mode) — degrade to memory
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
  catch(_){ const m={}; return {getItem:k=>m[k]??null,setItem:(k,v)=>m[k]=String(v),removeItem:k=>delete m[k]}; }
})();

window.addEventListener('error',e=>showBanner('Something broke while rendering: '+e.message));
window.addEventListener('unhandledrejection',e=>showBanner('A background step failed: '+(e.reason&&e.reason.message||e.reason)));
function showBanner(msg){ $('#bannerText').textContent=msg; $('#banner').style.display='flex'; }
let toastTimer=null;
function toast(msg){ $('#toast').textContent=msg; $('#toast').style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('#toast').style.display='none',3500); }

async function fetchSafe(url, tries=2){
  for(let i=0;i<tries;i++){
    try{ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
    catch(e){ if(i===tries-1) throw e; await new Promise(r2=>setTimeout(r2,800*(i+1))); }
  }
}
const parseJsonl=t=>t.trim().split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(_){return null}}).filter(Boolean);

// ── profile (localStorage, never expires until edited in the tab) ────────────
function loadProfile(){
  try{ PROFILE=JSON.parse(storage.getItem(PROFILE_KEY)||'null'); }catch(_){ PROFILE=null; }
  syncProfileButton();
  return PROFILE;
}
function syncProfileButton(){
  const b=$('#pbtn');
  if(b) b.classList.toggle('on', !!PROFILE);
}
function saveProfile(p){ PROFILE=p; storage.setItem(PROFILE_KEY, JSON.stringify(p)); }
function clientScore(l,p){
  const text=(l.title+' '+(l.location||'')+' '+(l.tags||[]).join(' ')+' '+l.kind).toLowerCase();
  let hits=0;
  (p.skills||[]).forEach(s=>{ if(text.includes(s.toLowerCase())) hits+=2; });
  (p.roles||[]).forEach(s=>{ if(text.includes(s.toLowerCase())) hits+=2; });
  (p.locations||[]).forEach(s=>{ if(text.includes(s.toLowerCase())) hits+=1; });
  const wantsWork=!(p.kinds||[]).length || p.kinds.some(k=>k==='job'||k==='internship');
  if(l.pathway && wantsWork) hits+=3;
  return hits;
}
function parseGoalClient(text){
  const t=text||'', adj={};
  const kinds=[];
  if(/\bjobs?\b|full[- ]?time|placement|hiring/i.test(t)) kinds.push('job');
  if(/intern/i.test(t)) kinds.push('internship');
  if(/hackathon/i.test(t)) kinds.push('hackathon');
  if(/competitions?\b|challenges?\b|contests?\b/i.test(t)) kinds.push('bounty');
  if(/scholarship|fellowship|grant/i.test(t)) kinds.push('scholarship');
  if(/\bevents?\b|meetup|conference|workshop/i.test(t)) kinds.push('event');
  if(/leads?\s+to\s+(jobs?|intern)|get\s+(hired|a\s+job)|ppo|placement/i.test(t))
    kinds.push('hackathon','bounty');
  if(/(first|1st|second|2nd|third|3rd|fourth|4th|final)\s+year|\byear\s*[1-4]\b/i.test(t)){
    if(!kinds.length) kinds.push('internship','hackathon','bounty','scholarship');
  }
  if(/remote|work\s+from\s+home|wfh/i.test(t)) adj.locations=['remote'];
  if(kinds.length) adj.kinds=[...new Set(kinds)];
  return adj;
}
function profileKinds(){ return (PROFILE&&PROFILE.kinds&&PROFILE.kinds.length)?PROFILE.kinds:null; }

// ── boot ─────────────────────────────────────────────────────────────────────
Promise.allSettled([
  fetchSafe('../data/latest.json'),
  fetch('../data/events.jsonl',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}),
  API?fetchSafe('/api/stars'):Promise.resolve({}),
  API?fetchSafe('/api/trends'):Promise.resolve(null)
]).then(([dataR, logR, starsR, trendsR])=>{
  if(dataR.status==='rejected'){ showBanner('Could not load radar data — is the pipeline run yet?'); }
  const data=dataR.status==='fulfilled'?dataR.value:null;
  const logText=logR.status==='fulfilled'?String(logR.value||''):'';
  const stars=starsR.status==='fulfilled'?starsR.value:{};
  if(!data&&!logText){ return; }
  STARS=new Set(Object.keys(stars||{}));
  LISTINGS=(data&&data.listings||[]).filter(l=>l&&l.title);   // malformed-row guard
  loadProfile();

  const evts=parseJsonl(logText);
  const runTs=evts.length?evts[evts.length-1].ts:null;
  $('#runage').textContent=runTs?`last run ${age(runTs)}`:'';
  const heals=evts.filter(e=>e.kind==='heal').length, enrichs=evts.filter(e=>e.kind==='enrich').length;
  const s=(data&&data.summary)||{};
  const srcs=new Set(LISTINGS.map(l=>String(l.source).split(', ')[0]));

  const tr=trendsR.status==='fulfilled'?trendsR.value:null;
  if(tr&&tr.daily){
    $('#trendText').textContent=tr.signal||'';
    $('#trendSpark').innerHTML=sparkSVG(tr.daily.new_per_day||[]);
    $('#trend').classList.add('on');
  }

  $('#cards').innerHTML=[
    ['live listings',s.total_live??LISTINGS.length],
    ['sources live',srcs.size],
    ['new since last run',s.new??'—'],
    ['closing this week',s.closing_this_week??'—'],
    ['⭐ starred',LISTINGS.filter(l=>STARS.has(l.id)).length],
    ['heals / enrich',`${heals} / ${enrichs}`]
  ].map(([k,v])=>`<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');

  applyProfileRanking(); renderChips(); render(); renderFeed(evts);
}).catch(err=>showBanner('Unexpected init failure: '+err.message));

function sparkSVG(vals){
  // tiny hand-built sparkline — no libraries, just a polyline scaled into view
  const w=230,h=34,max=Math.max(1,...vals),n=vals.length;
  if(!n) return '';
  const step=n>1?w/(n-1):0;
  const pts=vals.map((v,i)=>[i*step,h-3-(v/max)*(h-8)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"
    style="margin-top:6px;display:block" role="img" aria-label="new listings per day">
    <polyline fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" points="${line}"/>
    ${last?`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="var(--acc)"/>`:''}
  </svg>`;
}

function age(ts){const m=Math.round((Date.now()/1000-ts)/60);return m<90?m+'m ago':Math.round(m/60)+'h ago'}
function isFresh(iso){return iso&&(Date.now()-new Date(iso))/36e5<24}
function applyProfileRanking(){
  if(!PROFILE) return;
  LISTINGS.forEach(l=>l.match=clientScore(l,PROFILE));
  LISTINGS.sort((a,b)=>(b.match||0)-(a.match||0));
}

// ── filters + table ──────────────────────────────────────────────────────────
function renderChips(){
  const kinds=profileKinds()||[...new Set(LISTINGS.map(l=>l.kind))];
  const all=['all','⭐ starred','⏰ closing',...kinds];
  $('#chips').innerHTML=all.map(c=>`<button class="chip ${c===FILTER?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  document.querySelectorAll('.chip[data-c]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.c;renderChips();render();});
}
// search + sort controls (debounced so typing stays smooth on phones)
let qTimer=null;
$('#q').addEventListener('input',e=>{
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{QUERY=e.target.value.trim().toLowerCase();render();},150);
});
$('#sort').addEventListener('change',e=>{SORT=e.target.value;render();});
function visible(){
  const pk=profileKinds();
  return LISTINGS.filter(l=>{
    if(QUERY){
      const q=QUERY.split(/\s+/).filter(Boolean);
      const hay=(l.title+' '+(l.org||'')+' '+(l.location||'')+' '+l.kind+' '+(l.tags||[]).join(' ')).toLowerCase();
      if(!q.every(t=>hay.includes(t))) return false;
    }
    if(FILTER==='⭐ starred')return STARS.has(l.id);
    if(FILTER==='⏰ closing'){const d=daysLeft(l.deadline);return d!==null&&d>=0&&d<=7}
    if(FILTER==='all')return !pk||pk.includes(l.kind);
    return l.kind===FILTER;
  });
}
function sortedRows(vis){
  if(SORT==='deadline') return vis.slice().sort((a,b)=>{
    const da=daysLeft(a.deadline),db=daysLeft(b.deadline);
    if(da===null&&db===null)return 0; if(da===null)return 1; if(db===null)return -1;
    return da-db;
  });
  if(SORT==='newest') return vis.slice().sort((a,b)=>
    new Date(b.first_seen||0)-new Date(a.first_seen||0));
  return vis;
}
function render(){
  const newIds=new Set(LISTINGS.filter(l=>isFresh(l.first_seen)).map(l=>l.id));
  const vis=visible();
  $('#count').textContent=vis.length===LISTINGS.length
    ?`${LISTINGS.length} listings`:`${vis.length} of ${LISTINGS.length}`;
  $('#rows').innerHTML=sortedRows(vis).slice(0,80).map(l=>{
    const dl=daysLeft(l.deadline);
    const pill=dl===null||dl<0?'':dl===0?'<span class="pill today">today</span>':dl<=7?`<span class="pill soon">${dl}d</span>`:'';
    return `<tr class="row" data-id="${esc(l.id)}">
      <td><span class="star ${STARS.has(l.id)?'on':''}" data-star="${esc(l.id)}">${STARS.has(l.id)?'★':'☆'}</span></td>
      <td><a href="${esc(l.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a>
          <small style="color:var(--dim)">${esc(l.org)} · ${esc(l.source)}</small>
          ${newIds.has(l.id)?'<span class="pill new">new</span>':''}
          ${l.pathway?'<span class="pill path" title="prizes include a job/internship">→ job</span>':''}</td>
      <td class="hide-sm"><span class="pill kind">${esc(l.kind)}</span></td>
      <td>${esc(l.deadline||'—')} ${pill}</td>
      <td class="match">${l.match??''}</td></tr>`;
  }).join('')||'<tr><td colspan="5" style="color:var(--dim)">nothing matches this filter yet</td></tr>';
  document.querySelectorAll('.star').forEach(el=>el.onclick=e=>{e.stopPropagation();toggleStar(el.dataset.star)});
  document.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>openModal(tr.dataset.id));
}
async function toggleStar(id){
  if(!API){toast('Star syncing needs served mode: python -m pipeline serve');return}
  try{
    const r=await fetch('/api/star/'+encodeURIComponent(id),{method:'POST'});
    const {starred}=await r.json();
    starred?STARS.add(id):STARS.delete(id);
  }catch(_){ toast('Server unreachable — star saved locally for now'); STARS.add(id); }
  render();
}
function renderFeed(evts){
  $('#events').innerHTML=evts.slice(-120).reverse().map(e=>{
    const d=e.detail||{};
    const txt={
      run_start:`run started — ${d.sources??'?'} sources`,
      source_trigger:`trigger ${e.source}`,
      source_result:`${e.source}: ${d.raw_rows??'?'} raw → ${d.normalized??'?'} rows`,
      source_fail:`${e.source} failed — quarantined <small>${esc(d.error||'')}</small>`,
      dedup:`dedup ${d.raw??'?'} → ${d.unique??'?'} unique`,
      enrich:`deadline enrichment: ${d.filled??0}/${d.targets??0} filled`,
      delta:`Δ ${d.new??0} new · ${d.closing_this_week??0} closing`,
      heal:`self-heal on ${e.source} (${d.trigger||'manual'}) — collector id unchanged`,
      alert: d.trigger==='bodyguard' ? `⭐ bodyguard: ${d.pings??1} deadline ping(s) sent`
        : d.trigger==='watch' ? `👀 watch '${d.keyword}' fired — ${d.hits??'?'} new`
        : `digest delivered (${d.channel||'—'})`,
      bot: d.op==='auth_reject' ? `🔒 unknown sender rejected (not an admin)`
        : `bot: ${d.op||''}`,
      source_op: `source op: ${d.op||''} ${d.status||''} ${d.url?String(d.url).split('/')[2]||'':''}`,
      profile_update:`profile updated — digest uses it from next run`,
      run_end:`run complete — ${d.total_live??'?'} live`
    }[e.kind]||e.kind;
    return `<div class="ev ${e.kind==='source_fail'?'fail':''}${(e.kind==='heal'||e.kind==='enrich')?'heal':''}">
      <span class="t">${fmt(e.ts)}</span><span class="dot"></span><div>${txt}</div></div>`;
  }).join('')||'<div class="ev"><div style="color:var(--dim)">no events yet</div></div>';
}

// ── lineage modal ────────────────────────────────────────────────────────────
async function openModal(id){
  const l=LISTINGS.find(x=>x.id===id); if(!l)return;
  const m=$('#modal');
  let lineage='';
  if(API){
    try{
      const evs=await fetchSafe('/api/events?source='+encodeURIComponent(String(l.source).split(',')[0]));
      lineage=evs.slice(0,6).map(e=>`<div class="ev"><span class="t">${fmt(e.ts)}</span><span class="dot" style="background:${e.kind==='source_fail'?'var(--bad)':'var(--acc)'}"></span><div>${esc(e.kind)} — ${esc(e.status||'')}</div></div>`).join('');
    }catch(_){ lineage='<div style="color:var(--dim);font-size:13px">lineage unavailable (server unreachable)</div>'; }
  }
  m.innerHTML=`<button class="close" onclick="closeModal()">×</button>
    <h3>${esc(l.title)}</h3>
    <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.url)}</a>
    <div class="kv">
      <b>org</b><div>${esc(l.org)}</div>
      <b>kind</b><div>${esc(l.kind)}${l.pathway?' <span class="pill path">→ job</span>':''}</div>
      <b>location</b><div>${esc(l.location||'—')}</div>
      <b>deadline</b><div>${esc(l.deadline||'—')}</div>
      <b>match score</b><div>${esc(l.match??'—')}</div>
      <b>source(s)</b><div>${esc(l.source)}</div>
      <b>first seen</b><div>${esc(l.first_seen||'—')}</div>
    </div>
    <h4>lineage — runs that produced this row</h4>
    ${lineage||'<div style="color:var(--dim);font-size:13px">serve with <code>python -m pipeline serve</code> for live lineage</div>'}`;
  $('#modalBg').style.display='flex';
}
function closeModal(){ $('#modalBg').style.display='none'; }
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};

// ── personalize tab ──────────────────────────────────────────────────────────
function openPersonalize(){
  const p=PROFILE||{};
  const sel=new Set(p.kinds||[]);
  $('#modal').innerHTML=`<button class="close" onclick="closeModal()">×</button>
    <h3>⚙️ Personalize</h3>
    <div class="note">Saved in this browser only — no login. Applies instantly; never expires until you change it here.</div>
    <div class="pgrid">
      <div><label>what are you looking for?</label>
        <div class="tagrow" id="pKinds">${KINDS.map(k=>`<span class="tag ${sel.has(k)?'on':''}" data-k="${k}">${k}</span>`).join('')}</div></div>
      <div><label>skills (comma separated)</label>
        <input type="text" id="pSkills" value="${esc((p.skills||[]).join(', '))}" placeholder="python, react, web scraping"></div>
      <div><label>locations</label>
        <input type="text" id="pLocs" value="${esc((p.locations||[]).join(', '))}" placeholder="remote, bangalore, india"></div>
      <div><label>describe your goal (optional)</label>
        <input type="text" id="pGoal" value="${esc(p.goal||'')}" placeholder="2nd year, only internships — or: competitions that lead to jobs"></div>
    </div>
    <button class="btn" onclick="savePersonalize(true)">Save</button>
    <button class="btn ghost" onclick="savePersonalize(true,true)">Save + use for my digest</button>
    <button class="btn ghost" onclick="resetPersonalize()">Reset</button>
    <div class="note">"use for my digest" sends this to the server — the next pipeline run's Telegram alert matches it.</div>`;
  document.querySelectorAll('#pKinds .tag').forEach(t=>t.onclick=()=>{t.classList.toggle('on');});
  $('#modalBg').style.display='flex';
}
async function savePersonalize(close, forDigest){
  const kinds=[...document.querySelectorAll('#pKinds .tag.on')].map(t=>t.dataset.k);
  const goal=$('#pGoal').value.trim();
  const profile={
    kinds,
    skills:$('#pSkills').value.split(',').map(s=>s.trim()).filter(Boolean),
    locations:$('#pLocs').value.split(',').map(s=>s.trim()).filter(Boolean),
    goal:goal||undefined
  };
  const adj=parseGoalClient(goal);
  const merged={...profile,...adj};
  const mergedKinds=[...new Set([...(adj.kinds||[]),...kinds])];
  if(mergedKinds.length) merged.kinds=mergedKinds;
  saveProfile(merged);
  syncProfileButton();
  applyProfileRanking(); renderChips(); render();
  if(forDigest){
    if(!API){ toast('Digest sync needs served mode'); }
    else try{
      const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({profile:merged})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      toast('Saved — digest matches this from the next run');
    }catch(_){ toast('Could not reach server — profile still saved locally'); }
  } else toast('Personalized ✓ (saved in this browser)');
  closeModal();
}
function resetPersonalize(){ storage.removeItem(PROFILE_KEY); PROFILE=null;
  syncProfileButton();
  applyProfileRanking(); renderChips(); render(); closeModal(); toast('Personalization cleared'); }
window.openPersonalize=openPersonalize; window.closeModal=closeModal;
window.savePersonalize=savePersonalize; window.resetPersonalize=resetPersonalize;

if('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
