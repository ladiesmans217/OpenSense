name: radar

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours — the run history below is the reliability evidence
  workflow_dispatch:            # manual "Run workflow" button for demos
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write               # data/ (state, event log) is committed back each run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - run: pip install -r requirements.txt

      - name: run pipeline (self-healing enabled)
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline run --auto-heal

      - name: commit run artifacts
        run: |
          git config user.name  "opensense-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git commit -m "radar: run $(date -u +%FT%TZ) [skip ci]" || echo "nothing to commit"
          git push
