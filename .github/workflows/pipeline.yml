name: radar

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours — the run history below is the reliability evidence
  workflow_dispatch:            # manual "Run workflow" button for demos
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write               # data/ (state, event log) is committed back each run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest
      - name: Run pytest -q
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest_output.txt
      - name: publish pytest output for debugging (branch is public-readable)
        if: always()
        run: |
          git config user.name  "opensense-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B ci-debug
          cp pytest_output.txt .github/ci-pytest-output.txt
          git add .github/ci-pytest-output.txt
          git commit -m "ci: pytest output [skip ci]" || echo "no changes"
          git push origin ci-debug -f

  run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - run: pip install -r requirements.txt

      - name: run pipeline (self-healing enabled)
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline run --auto-heal

      - name: "guard — never commit a degraded dataset (bad token means all collectors 401)"
        run: |
          python - <<'EOF'
          import json, sys
          listings = json.load(open("data/latest.json"))["listings"]
          collector_rows = [l for l in listings if not l["source"].startswith("api-")]
          print(f"collector rows: {len(collector_rows)} / {len(listings)}")
          if len(listings) < 50 or not collector_rows:
              print("::error::run produced a degraded dataset — keeping the previous good data")
              sys.exit(1)
          EOF

      - name: commit run artifacts
        run: |
          git config user.name  "opensense-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git commit -m "radar: run $(date -u +%FT%TZ) [skip ci]" || echo "nothing to commit"
          git push
