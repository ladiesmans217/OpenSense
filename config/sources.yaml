# Target: 15–25 heterogeneous live sources before submission.
# Every block you enable MUST have a collector_id and MUST have passed the Step-0 library check.

# Deadline enrichment: listing cards don't show deadlines, detail pages do.
# One PDP collector, batch-triggered with the newest deadline-less listings each run.
enrichment:
  collector_id: c_mt4b7xa74eyt2c99i   # opensense-hackathon-detail (PDP type)
  kinds: [hackathon, event]
  url_patterns: [devfolio.co]          # the detail collector is built for these pages

