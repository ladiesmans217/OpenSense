# OpenSense source registry.
#
# STEP 0 (mandatory, from the hackathon rules): before building a collector for any source,
# verify it is NOT covered by Bright Data's pre-built library:
#   https://brightdata.com/cp/scrapers/browse
# If a source is covered, replace it — custom scrapers for the long tail are the point.
#
# type: pdp | discovery | discovery_pdp | sitemap | search   (Scraper Studio scraper types)
# kind: how OpenSense categorizes the rows (internship | hackathon | scholarship | bounty | event | job)
#
# collector_id: fill after `bdata scraper create` — the c_* id is the production endpoint.

sources:
  # ── Internships: the platform everyone uses — now inside the radar ──────────
  - name: internshala-internships
    kind: internship
    type: discovery
    seed_url: https://internshala.com/internships
    collector_id: c_mt4fp37e1axygyx76t
    field_map: {title: internship_title, url: internship_url, org: company_name,
                location: location, stipend: stipend, deadline: apply_by}
    verify_not_prebuilt: true

